<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--fg:#e8eaed;--mut:#9aa3af;--card:#1d2128;--bd:#2d333c;--ac:#7fb0e0}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.chartbox{position:relative;height:340px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:7px 11px;font-size:13px;cursor:pointer;border-radius:8px}
.seg button.on,.btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
input[type=search]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip b{cursor:pointer;color:var(--mut);padding:0 4px;font-weight:400;font-size:16px}
.list{max-height:260px;overflow-y:auto;margin-top:8px;border:1px solid var(--bd);border-radius:8px}
.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border:0}
.item input{width:18px;height:18px}
.item small{color:var(--mut);margin-left:auto;white-space:nowrap}
.lab{font-size:12px;color:var(--mut);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.empty{color:var(--mut);font-size:13px}
</style></head>
<body><main>
<h1>Portland Public Schools enrollment</h1>
<div class="sub">2016-17 to 2025-26 · pick any number of schools to compare · <a href="https://www.pps.net/fs/resource-manager/view/aefd9869-b3da-4cf6-b9c6-1bec5149eb03" target="_blank" rel="noopener" style="color:var(--ac)">source data</a></div>

<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <div class="seg" id="mode">

</div>

  <div class="row" style="margin-top:8px"><button class="btn" id="clear">Clear all</button><button class="btn" id="addvis">Add all shown</button></div>
</div>

<div class="card">
  <p class="lab">Add schools</p>
  <input type="search" id="q" placeholder="Search schools…">
  <div class="seg" id="lv" style="margin-top:8px">
    <button data-l="all" class="on">All</button><button data-l="el">Elementary</button><button data-l="mid">Middle</button><button data-l="hs">High</button><button data-l="k8">K-8</button>
  </div>
  <div class="list" id="list"></div>
</div>

const level=g=>{if(/^(KG|PK)-5$|^PK$/.test(g))return"el";if(g==="6-8")return"mid";if(g==="9-12"||g==="8-12")return"hs";return"k8"};
D.forEach(s=>s.l=level(s.g));
const sel=new Map(); let mode="abs",showTot=false,lv="all",chart;
const PAL=["#2f6fb0","#e07a1f","#2e9d5b","#c23b5a","#7a52b3","#16a3b8","#b8a000","#8c5a3c","#d94fa0","#5f6b7a"];
const used=()=>new Set([...sel.values()]);
const nextColor=()=>{const u=used();for(const c of PAL)if(!u.has(c))return c;return`hsl(${(sel.size*47)%360},60%,50%)`};
const $=id=>document.getElementById(id);
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function series(vals){
  if(mode==="abs")return vals;
  if(mode==="idx"){const b=vals.find(v=>v!=null);return vals.map(v=>v==null?null:+(v/b*100).toFixed(1))}
  return vals.map((v,i)=>i===0||v==null||vals[i-1]==null?null:+((v-vals[i-1])/vals[i-1]*100).toFixed(1));
}
function draw(){
  const ds=[];
  sel.forEach((col,n)=>{const s=D.find(x=>x.n===n);ds.push({label:n,data:series(s.v),borderColor:col,backgroundColor:col,borderWidth:2.5,pointRadius:3,tension:.2,spanGaps:false})});
  if(showTot&&sel.size){
    const tv=YEARS.map((_,i)=>{let t=0,ok=false;sel.forEach((c,n)=>{const v=D.find(x=>x.n===n).v[i];if(v!=null){t+=v;ok=true}});return ok?t:null});
    ds.push({label:"Combined total",data:series(tv),borderColor:cssv("--fg"),backgroundColor:cssv("--fg"),borderDash:[6,4],borderWidth:2,pointRadius:2,spanGaps:false});
  }
  const mut=cssv("--mut"),bd=cssv("--bd");
  const cfg={type:"line",data:{labels:YEARS,datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:false},tooltip:{itemSort:(a,b)=>(b.raw??-1e9)-(a.raw??-1e9),callbacks:{label:c=>{const v=c.raw;return` ${c.dataset.label}: ${v==null?"n/a":mode==="abs"?v.toLocaleString():v+"%"}`}}}},
    scales:{x:{ticks:{color:mut,maxRotation:45},grid:{color:bd}},y:{ticks:{color:mut,callback:v=>mode==="abs"?v:v+"%"},grid:{color:bd},beginAtZero:mode==="abs",title:{display:true,color:mut,text:mode==="abs"?"Students":mode==="idx"?"Share of first-year enrollment":"Year-over-year change"}}}}};
  if(chart)chart.destroy();
  if(!ds.length){const c=$("c").getContext("2d");c.clearRect(0,0,9999,9999);c.fillStyle=mut;c.font="14px system-ui";c.fillText("Select schools below to chart them",16,40);chart=null;return}
  chart=new Chart($("c"),cfg);
}
function chips(){
  const el=$("chips");el.innerHTML="";
  if(!sel.size){el.innerHTML='<span class="empty">None yet. Tap schools below.</span>';return}
  sel.forEach((col,n)=>{const d=document.createElement("span");d.className="chip";d.innerHTML=`<i style="background:${col}"></i>${n}<b title="Remove">×</b>`;d.querySelector("b").onclick=()=>{sel.delete(n);refresh()};el.appendChild(d)});
}
const visible=()=>{const q=$("q").value.trim().toLowerCase();return D.filter(s=>(lv==="all"||s.l===lv)&&s.n.toLowerCase().includes(q))};
function list(){
  const el=$("list");el.innerHTML="";const v=visible();
  if(!v.length){el.innerHTML='<div class="item empty">No matches</div>';return}
  v.forEach(s=>{const last=[...s.v].reverse().find(x=>x!=null);const r=document.createElement("label");r.className="item";
    r.innerHTML=`<input type="checkbox" ${sel.has(s.n)?"checked":""}><span>${s.n}</span><small>${s.g} · ${last??"–"}</small>`;
    r.querySelector("input").onchange=e=>{e.target.checked?sel.set(s.n,nextColor()):sel.delete(s.n);chips();draw()};
    el.appendChild(r)});
}
function refresh(){chips();list();draw()}
$("q").oninput=list;
$("mode").onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;[...$("mode").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));draw()};
$("lv").onclick=e=>{const l=e.target.dataset.l;if(!l)return;lv=l;[...$("lv").children].forEach(b=>b.classList.toggle("on",b.dataset.l===l));list()};
$("tot").onclick=()=>{showTot=!showTot;$("tot").classList.toggle("on",showTot);draw()};
$("clear").onclick=()=>{sel.clear();refresh()};
$("addvis").onclick=()=>{visible().slice(0,40).forEach(s=>{if(!sel.has(s.n))sel.set(s.n,nextColor())});refresh()};
["Maplewood","Rieke","Hayhurst","Markham"].forEach(n=>{if(D.some(s=>s.n===n))sel.set(n,nextColor())});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
refresh();
</script></body></html>
